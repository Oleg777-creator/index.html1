<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Star Gift - Case Opening</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      background-color: #0f0f1a;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      text-align: center;
      margin: 0;
      padding: 15px;
      padding-bottom: 40px;
    }
    .balance-box {
      font-size: 18px;
      font-weight: bold;
      background: #1a1a2e;
      padding: 10px;
      border-radius: 12px;
      margin-bottom: 15px;
      border: 1px solid #333;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .top-up-btn {
      background: #28a745;
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
    }
    .case-card {
      background: #1a1a2e;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
    }
    /* Рулетка */
    .roulette-container {
      position: relative;
      width: 100%;
      max-width: 320px;
      height: 90px;
      overflow: hidden;
      background: #111;
      border: 2px solid #555;
      border-radius: 10px;
      margin: 10px auto;
    }
    .roulette-pointer {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 4px;
      height: 100%;
      background: #ffcc00;
      z-index: 10;
    }
    .roulette-track {
      display: flex;
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      transition: transform 4s cubic-bezier(0.15, 0.85, 0.35, 1);
    }
    .roulette-item {
      min-width: 90px;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #252542;
      border-right: 1px solid #333;
      color: #fff;
      font-size: 13px;
      font-weight: bold;
    }
    button.action-btn {
      background: #ffcc00;
      color: #000;
      border: none;
      padding: 10px 15px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin: 5px 0;
      width: 100%;
    }
    button:disabled {
      background: #555;
      color: #888;
      cursor: not-allowed;
    }
    .secondary-btn {
      background: #4a4ae2;
      color: #fff;
      border: none;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      width: 100%;
      margin-top: 5px;
    }
    /* Модальне вікно */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      z-index: 100;
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background: #1e1e2f;
      padding: 20px;
      border-radius: 12px;
      width: 85%;
      max-width: 300px;
      color: #fff;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- Блок балансу та поповнення -->
  <div class="balance-box">
    <span>⭐ <span id="balanceDisplay">0</span> зірок</span>
    <button class="top-up-btn" onclick="topUpStars()">+ Поповнити</button>
  </div>

  <!-- БЕЗКОШТОВНИЙ КЕЙС -->
  <div class="case-card">
    <h3>🎁 Безкоштовний кейс</h3>
    <div id="timerDisplay" style="color: #aaa; font-size: 13px; margin-bottom: 8px;">Перевірка таймера...</div>
    
    <div class="roulette-container">
      <div class="roulette-pointer"></div>
      <div class="roulette-track" id="rouletteTrackFree">
        <div class="roulette-item"><span>🎁</span><small>Подарунок</small></div>
        <div class="roulette-item"><span>🎁</span><small>Подарунок</small></div>
        <div class="roulette-item"><span>🎁</span><small>Подарунок</small></div>
      </div>
    </div>

    <button class="action-btn" id="openFreeBtn" onclick="startFreeOpening()">Відкрити безкоштовно</button>
    <button class="secondary-btn" onclick="openPrizeModal('free')">📦 Що може випасти?</button>
  </div>

  <!-- ПЛАТНИЙ КЕЙС -->
  <div class="case-card">
    <h3>💎 Преміум кейс (50 зірок)</h3>
    <button class="action-btn" style="background:#ff9900;" onclick="startPaidOpening(50)">Відкрити за 50 ⭐</button>
    <button class="secondary-btn" onclick="openPrizeModal('paid')">📦 Вміст кейса</button>
  </div>

  <!-- Модальне вікно вмісту -->
  <div id="prizeModal" class="modal">
    <div class="modal-content">
      <h3>Вміст кейса</h3>
      <div id="modalItemsList" style="margin: 15px 0; text-align:left; font-size: 14px;"></div>
      <button class="action-btn" onclick="closePrizeModal()">Закрити</button>
    </div>
  </div>

  <script>
    // Твої ключі Supabase (без зайвого хвоста /rest/v1/)
    const SUPABASE_URL = 'https://nlepgjjceiroonynqgoi.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_QpTiOqr_Uh4viHl7uVTA3A_JDBfNyPZ';
    
    let supabaseClient = null;
    try {
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    } catch (e) {
      console.error("Помилка ініціалізації Supabase:", e);
    }

    const tg = window.Telegram.WebApp;
    tg.expand();
    const telegramId = tg.initDataUnsafe?.user?.id ? String(tg.initDataUnsafe.user.id) : "test_user_777";

    let userBalance = 0;
    let lastOpenTime = 0;
    const COOLDOWN_TIME = 24 * 60 * 60 * 1000; // 24 години

    const freeCaseItems = [
      { name: "20 Зірок", value: 20, chance: 80.0 },
      { name: "50 Зірок", value: 50, chance: 15.0 },
      { name: "100 Зірок", value: 100, chance: 3.5 },
      { name: "400 Зірок", value: 400, chance: 1.5 }
    ];

    const paidCaseItems = [
      { name: "40 Зірок", value: 40, chance: 60.0 },
      { name: "100 Зірок", value: 100, chance: 30.0 },
      { name: "300 Зірок", value: 300, chance: 8.5 },
      { name: "1000 Зірок", value: 1000, chance: 1.5 }
    ];

    // Завантаження даних
    async function loadUserData() {
      if (!supabaseClient) {
        userBalance = 100;
        updateUI();
        return;
      }

      let { data, error } = await supabaseClient
        .from('users')
        .select('*')
        .eq('telegram_id', telegramId)
        .single();

      if (error || !data) {
        await supabaseClient.from('users').insert([
          { telegram_id: telegramId, stars_balance: 100, free_case_timer: 0 }
        ]);
        userBalance = 100;
        lastOpenTime = 0;
      } else {
        userBalance = Number(data.stars_balance) || 0;
        lastOpenTime = Number(data.free_case_timer) || 0;
      }
      updateUI();
    }

    // Збереження даних
    async function saveUserData(newBalance, newTimer) {
      userBalance = newBalance;
      if (newTimer !== undefined) lastOpenTime = newTimer;
      updateUI();

      if (!supabaseClient) return;

      await supabaseClient
        .from('users')
        .upsert({
          telegram_id: telegramId,
          stars_balance: userBalance,
          free_case_timer: lastOpenTime
        });
    }

    function updateUI() {
      document.getElementById('balanceDisplay').innerText = userBalance;
      
      const now = Date.now();
      const timeLeft = (lastOpenTime + COOLDOWN_TIME) - now;
      const openBtn = document.getElementById('openFreeBtn');
      const timerDisplay = document.getElementById('timerDisplay');

      if (timeLeft > 0) {
        openBtn.disabled = true;
        const hours = Math.floor(timeLeft / (1000 * 60 * 60));
        const minutes = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
        timerDisplay.innerText = `Наступний кейс через: ${hours}г ${minutes}хв`;
      } else {
        openBtn.disabled = false;
        timerDisplay.innerText = `Кейс доступний безкоштовно!`;
      }
    }

    function getRandomItem(items) {
      const rand = Math.random() * 100;
      let cumulative = 0;
      for (let item of items) {
        cumulative += item.chance;
        if (rand <= cumulative) return item;
      }
      return items[0];
    }

    // Відкриття безкоштовного кейса
    function startFreeOpening() {
      const now = Date.now();
      if (now < lastOpenTime + COOLDOWN_TIME) return;

      document.getElementById('openFreeBtn').disabled = true;
      const track = document.getElementById('rouletteTrackFree');
      const winningItem = getRandomItem(freeCaseItems);
      const winningIndex = 30;

      let html = '';
      for (let i = 0; i < 35; i++) {
        let item = (i === winningIndex) ? winningItem : getRandomItem(freeCaseItems);
        html += `<div class="roulette-item"><span>🎁</span><small>${item.name}</small></div>`;
      }
      track.innerHTML = html;

      track.style.transition = 'none';
      track.style.transform = 'translateX(0px)';

      setTimeout(() => {
        const itemWidth = 90;
        const offset = (winningIndex * itemWidth) - (160 - (itemWidth / 2));
        track.style.transition = 'transform 4s cubic-bezier(0.05, 0.9, 0.2, 1)';
        track.style.transform = `translateX(-${offset}px)`;
      }, 50);

      setTimeout(() => {
        const newBalance = userBalance + winningItem.value;
        saveUserData(newBalance, Date.now());
        alert(`Вітаю! Ви виграли ${winningItem.name}`);
      }, 4100);
    }

    // Відкриття платних кейсів
    function startPaidOpening(cost) {
      if (userBalance < cost) {
        alert("Недостатньо зірок на балансі!");
        return;
      }

      const winningItem = getRandomItem(paidCaseItems);
      const newBalance = userBalance - cost + winningItem.value;
      saveUserData(newBalance);
      alert(`Ви відкрили преміум кейс і виграли ${winningItem.name}! Баланс оновлено.`);
    }

    // Поповнення зірок
    function topUpStars() {
      const added = 50;
      saveUserData(userBalance + added);
      alert(`Баланс успішно поповнено на ${added} зірок!`);
    }

    // Модальне вікно
    function openPrizeModal(type) {
      const items = type === 'free' ? freeCaseItems : paidCaseItems;
      const container = document.getElementById('modalItemsList');
      container.innerHTML = items.map(i => `
        <div style="display:flex; justify-content:space-between; margin-bottom:6px; border-bottom:1px solid #333; padding-bottom:4px;">
          <span>${i.name}</span>
          <span style="color:#ffcc00;">${i.chance}%</span>
        </div>
      `).join('');
      document.getElementById('prizeModal').style.display = 'flex';
    }

    function closePrizeModal() {
      document.getElementById('prizeModal').style.display = 'none';
    }

    // Старт
    loadUserData();
  </script>
</body>
</html>
