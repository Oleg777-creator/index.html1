<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Star Gift - Case Opening</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      background-color: #0f0f1a;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px;
    }
    .balance-box {
      font-size: 20px;
      font-weight: bold;
      background: #1a1a2e;
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 20px;
      border: 1px solid #333;
    }
    /* Рулетка */
    .roulette-container {
      position: relative;
      width: 100%;
      max-width: 320px;
      height: 100px;
      overflow: hidden;
      background: #111;
      border: 2px solid #555;
      border-radius: 12px;
      margin: 20px auto;
    }
    .roulette-pointer {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 4px;
      height: 100%;
      background: #ffcc00;
      z-index: 10;
    }
    .roulette-track {
      display: flex;
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      transition: transform 4s cubic-bezier(0.15, 0.85, 0.35, 1);
    }
    .roulette-item {
      min-width: 100px;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #1a1a2e;
      border-right: 1px solid #333;
      color: #fff;
      font-size: 14px;
      font-weight: bold;
    }
    button {
      background: #ffcc00;
      color: #000;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin: 10px 0;
      width: 100%;
      max-width: 320px;
    }
    button:disabled {
      background: #555;
      color: #888;
      cursor: not-allowed;
    }
    /* Модальне вікно */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      z-index: 100;
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background: #1e1e2f;
      padding: 20px;
      border-radius: 12px;
      width: 85%;
      max-width: 320px;
      color: #fff;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="balance-box">⭐ Баланс: <span id="balanceDisplay">0</span> зірок</div>

  <h3>Безкоштовний кейс</h3>
  <div id="timerDisplay" style="color: #aaa; margin-bottom: 10px;">Завантаження...</div>

  <!-- Рулетка -->
  <div class="roulette-container">
    <div class="roulette-pointer"></div>
    <div class="roulette-track" id="rouletteTrack"></div>
  </div>

  <button id="openBtn" onclick="startOpening()">Відкрити кейс</button>
  <button onclick="openPrizeModal()" style="background:#4a4ae2; color:#fff;">📦 Що може випасти?</button>

  <!-- Модальне вікно вмісту кейса -->
  <div id="prizeModal" class="modal">
    <div class="modal-content">
      <h3>Вміст кейса</h3>
      <div id="modalItemsList" style="margin: 15px 0; text-align:left;"></div>
      <button onclick="closePrizeModal()" style="background:#ffcc00;">Закрити</button>
    </div>
  </div>

  <script>
    // ПРИКЛАД: Заміни на свої ключі Supabase
    const SUPABASE_URL = https:/nlepgjjceiroonynqgoi.supabase.co/rest/v1/;
    const SUPABASE_ANON_KEY = sb_publishable_QpTiOqr_Uh4viHl7uVTA3A_JDBfNyPZ;
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const tg = window.Telegram.WebApp;
    tg.expand();
    const telegramId = tg.initDataUnsafe?.user?.id ? String(tg.initDataUnsafe.user.id) : "test_user_777";

    let userBalance = 0;
    let lastOpenTime = 0;
    const COOLDOWN_TIME = 24 * 60 * 60 * 1000; // 24 години у мілісекундах

    // Список призів та їхні шанси (у сумі 100%)
    const caseItems = [
      { name: "20 Зірок", value: 20, chance: 80.0 },
      { name: "50 Зірок", value: 50, chance: 15.0 },
      { name: "100 Зірок", value: 100, chance: 3.5 },
      { name: "400 Зірок", value: 400, chance: 1.5 }
    ];

    // Ініціалізація рулетки порожніми елементами для краси
    function initRouletteVisual() {
      const track = document.getElementById('rouletteTrack');
      let html = '';
      for (let i = 0; i < 10; i++) {
        html += `<div class="roulette-item"><span>🎁</span><small>Кейс</small></div>`;
      }
      track.innerHTML = html;
    }

    // Завантаження даних з Supabase
    async function loadUserData() {
      let { data, error } = await supabase
        .from('users')
        .select('*')
        .eq('telegram_id', telegramId)
        .single();

      if (error || !data) {
        // Створюємо нового користувача, якщо його немає
        await supabase.from('users').insert([
          { telegram_id: telegramId, stars_balance: 50, free_case_timer: 0 }
        ]);
        userBalance = 50;
        lastOpenTime = 0;
      } else {
        userBalance = data.stars_balance;
        lastOpenTime = Number(data.free_case_timer) || 0;
      }
      updateUI();
    }

    // Збереження даних в Supabase
    async function saveUserData(newBalance, newTimer) {
      userBalance = newBalance;
      lastOpenTime = newTimer;

      const { error } = await supabase
        .from('users')
        .upsert({
          telegram_id: telegramId,
          stars_balance: newBalance,
          free_case_timer: newTimer
        });

      if (error) {
        console.error("Помилка збереження:", error);
      }
      updateUI();
    }

    function updateUI() {
      document.getElementById('balanceDisplay').innerText = userBalance;
      
      const now = Date.now();
      const timeLeft = (lastOpenTime + COOLDOWN_TIME) - now;
      const openBtn = document.getElementById('openBtn');
      const timerDisplay = document.getElementById('timerDisplay');

      if (timeLeft > 0) {
        openBtn.disabled = true;
        const hours = Math.floor(timeLeft / (1000 * 60 * 60));
        const minutes = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
        timerDisplay.innerText = `Наступний кейс через: ${hours}г ${minutes}хв`;
      } else {
        openBtn.disabled = false;
        timerDisplay.innerText = `Кейс доступний безкоштовно!`;
      }
    }

    // Вибір призу за відсотками (шансами)
    function getRandomItem() {
      const rand = Math.random() * 100;
      let cumulative = 0;
      for (let item of caseItems) {
        cumulative += item.chance;
        if (rand <= cumulative) return item;
      }
      return caseItems[0];
    }

    // Запуск рулетки
    function startOpening() {
      const now = Date.now();
      if (now < lastOpenTime + COOLDOWN_TIME) return;

      const openBtn = document.getElementById('openBtn');
      openBtn.disabled = true;

      const track = document.getElementById('rouletteTrack');
      const winningItem = getRandomItem();
      const winningIndex = 35; // Позиція виграшного елемента у довгій стрічці

      let itemsHtml = '';
      for (let i = 0; i < 40; i++) {
        let item = (i === winningIndex) ? winningItem : getRandomItem();
        itemsHtml += `<div class="roulette-item"><span>🎁</span><small>${item.name}</small></div>`;
      }
      track.innerHTML = itemsHtml;

      // Скидаємо рулетку на початок
      track.style.transition = 'none';
      track.style.transform = 'translateX(0px)';

      setTimeout(() => {
        const itemWidth = 100;
        const offset = (winningIndex * itemWidth) - (160 - (itemWidth / 2));
        track.style.transition = 'transform 4s cubic-bezier(0.05, 0.9, 0.2, 1)';
        track.style.transform = `translateX(-${offset}px)`;
      }, 50);

      // Завершення прокрутки через 4.1 секунди
      setTimeout(() => {
        const newBalance = userBalance + winningItem.value;
        saveUserData(newBalance, Date.now());
        alert(`Вітаю! Ви виграли ${winningItem.name}`);
      }, 4100);
    }

    // Модальне вікно вмісту
    function openPrizeModal() {
      const container = document.getElementById('modalItemsList');
      container.innerHTML = caseItems.map(i => `
        <div style="display:flex; justify-content:space-between; margin-bottom:8px; border-bottom:1px solid #333; padding-bottom:4px;">
          <span>${i.name}</span>
          <span style="color:#aaa;">${i.chance}%</span>
        </div>
      `).join('');
      document.getElementById('prizeModal').style.display = 'flex';
    }

    function closePrizeModal() {
      document.getElementById('prizeModal').style.display = 'none';
    }

    // Запуск при завантаженні сторінки
    initRouletteVisual();
    loadUserData();
  </script>
</body>
</html>
