<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Star Gift - Case Opening</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-color: #0b0e14;
      --card-bg: #151b26;
      --accent: #f3ba2f;
      --accent-gradient: linear-gradient(135deg, #f3ba2f 0%, #f7931a 100%);
      --purple-gradient: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      --text-main: #ffffff;
      --text-secondary: #94a3b8;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 16px;
      padding-bottom: 50px;
    }

    /* Шапка профілю та балансу */
    .header-card {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .balance-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .balance-info {
      font-size: 20px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--accent);
    }

    .action-group {
      display: flex;
      gap: 8px;
    }

    .btn-small {
      flex: 1;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-small:active {
      transform: scale(0.96);
    }

    /* Картки кейсів */
    .case-card {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    }

    .case-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .case-timer {
      color: var(--text-secondary);
      font-size: 12px;
      margin-bottom: 14px;
      font-weight: 500;
    }

    /* Рулетка */
    .roulette-container {
      position: relative;
      width: 100%;
      height: 95px;
      overflow: hidden;
      background: #090c10;
      border: 2px solid rgba(243, 186, 47, 0.3);
      border-radius: 14px;
      margin: 12px 0;
    }

    .roulette-pointer {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 3px;
      height: 100%;
      background: #ef4444;
      z-index: 10;
      box-shadow: 0 0 10px #ef4444;
    }

    .roulette-track {
      display: flex;
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      transition: transform 4s cubic-bezier(0.15, 0.85, 0.35, 1);
    }

    .roulette-item {
      min-width: 95px;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #1e2532 0%, #151b26 100%);
      border-right: 1px solid rgba(255, 255, 255, 0.05);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
    }

    .roulette-item span {
      font-size: 24px;
      margin-bottom: 2px;
    }

    /* Кнопки */
    .btn-primary {
      background: var(--accent-gradient);
      color: #000;
      border: none;
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 4px 15px rgba(243, 186, 47, 0.3);
      transition: transform 0.1s;
    }

    .btn-primary:active {
      transform: scale(0.97);
    }

    .btn-primary:disabled {
      background: #2d3748;
      color: #718096;
      box-shadow: none;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: var(--purple-gradient);
      color: #fff;
      border: none;
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      margin-top: 8px;
    }

    /* Модальні вікна */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(5px);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-content {
      background: #18202f;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 24px;
      border-radius: 24px;
      width: 100%;
      max-width: 320px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }

    .modal-content h3 {
      margin-top: 0;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>

  <!-- Шапка балансу -->
  <div class="header-card">
    <div class="balance-row">
      <div class="balance-info">
        ⭐ <span id="balanceDisplay">0</span>
      </div>
      <div style="font-size: 12px; color: var(--text-secondary);">Ваш баланс</div>
    </div>
    <div class="action-group">
      <button class="btn-small" onclick="openTopUpModal()">💳 Поповнити</button>
      <button class="btn-small" onclick="openWithdrawModal()">📤 Вивести</button>
    </div>
  </div>

  <!-- БЕЗКОШТОВНИЙ КЕЙС -->
  <div class="case-card">
    <div class="case-title">🎁 Безкоштовний кейс</div>
    <div id="timerDisplay" class="case-timer">Перевірка таймера...</div>
    
    <div class="roulette-container">
      <div class="roulette-pointer"></div>
      <div class="roulette-track" id="rouletteTrackFree">
        <div class="roulette-item"><span>🎁</span>Подарунок</div>
        <div class="roulette-item"><span>🎁</span>Подарунок</div>
        <div class="roulette-item"><span>🎁</span>Подарунок</div>
      </div>
    </div>

    <button class="btn-primary" id="openFreeBtn" onclick="startFreeOpening()">Відкрити безкоштовно</button>
    <button class="btn-secondary" onclick="openPrizeModal('free')">📦 Вміст кейса</button>
  </div>

  <!-- ПЛАТНИЙ КЕЙС -->
  <div class="case-card">
    <div class="case-title">💎 Преміум кейс</div>
    <div class="case-timer">Вартість відкриття: 50 зірок ⭐</div>
    
    <button class="btn-primary" style="background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);" onclick="startPaidOpening(50)">Відкрити за 50 ⭐</button>
    <button class="btn-secondary" onclick="openPrizeModal('paid')">📦 Вміст кейса</button>
  </div>

  <!-- Модальне вікно: Вміст кейса -->
  <div id="prizeModal" class="modal">
    <div class="modal-content">
      <h3>Шанси кейса</h3>
      <div id="modalItemsList" style="margin: 15px 0; text-align:left; font-size: 14px;"></div>
      <button class="btn-primary" onclick="closeModal('prizeModal')">Закрити</button>
    </div>
  </div>

  <!-- Модальне вікно: Поповнення -->
  <div id="topUpModal" class="modal">
    <div class="modal-content">
      <h3>Поповнення зірок</h3>
      <p style="font-size: 13px; color: var(--text-secondary); margin-bottom: 20px;">Оберіть пакет зірок для поповнення через Telegram Stars:</p>
      <button class="btn-primary" style="margin-bottom: 10px;" onclick="simulateInvoice(50)">+50 зірок (Test)</button>
      <button class="btn-primary" style="margin-bottom: 15px;" onclick="simulateInvoice(200)">+200 зірок (Test)</button>
      <button class="btn-small" style="width:100%; padding: 12px;" onclick="closeModal('topUpModal')">Скасувати</button>
    </div>
  </div>

  <!-- Модальне вікно: Виведення -->
  <div id="withdrawModal" class="modal">
    <div class="modal-content">
      <h3>Виведення зірок</h3>
      <p style="font-size: 13px; color: var(--text-secondary); margin-bottom: 20px;">Мінімальна сума для виведення: 500 зірок.</p>
      <button class="btn-primary" style="margin-bottom: 15px;" onclick="requestWithdraw()">Вивести на баланс Telegram</button>
      <button class="btn-small" style="width:100%; padding: 12px;" onclick="closeModal('withdrawModal')">Скасувати</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://nlepgjjceiroonynqgoi.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_QpTiOqr_Uh4viHl7uVTA3A_JDBfNyPZ';
    
    let supabaseClient = null;
    try {
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    } catch (e) {
      console.error("Помилка Supabase:", e);
    }

    const tg = window.Telegram.WebApp;
    tg.expand();
    const telegramId = tg.initDataUnsafe?.user?.id ? String(tg.initDataUnsafe.user.id) : "test_user_777";

    let userBalance = 0;
    let lastOpenTime = 0;
    const COOLDOWN_TIME = 24 * 60 * 60 * 1000;

    const freeCaseItems = [
      { name: "20 Зірок", value: 20, chance: 80.0 },
      { name: "50 Зірок", value: 50, chance: 15.0 },
      { name: "100 Зірок", value: 100, chance: 3.5 },
      { name: "400 Зірок", value: 400, chance: 1.5 }
    ];

    const paidCaseItems = [
      { name: "40 Зірок", value: 40, chance: 60.0 },
      { name: "100 Зірок", value: 100, chance: 30.0 },
      { name: "300 Зірок", value: 300, chance: 8.5 },
      { name: "1000 Зірок", value: 1000, chance: 1.5 }
    ];

    async function loadUserData() {
      if (!supabaseClient) {
        userBalance = 1710;
        updateUI();
        return;
      }

      let { data, error } = await supabaseClient
        .from('users')
        .select('*')
        .eq('telegram_id', telegramId)
        .single();

      if (error || !data) {
        await supabaseClient.from('users').insert([
          { telegram_id: telegramId, stars_balance: 100, free_case_timer: 0 }
        ]);
        userBalance = 100;
        lastOpenTime = 0;
      } else {
        userBalance = Number(data.stars_balance) || 0;
        lastOpenTime = Number(data.free_case_timer) || 0;
      }
      updateUI();
    }

    async function saveUserData(newBalance, newTimer) {
      userBalance = newBalance;
      if (newTimer !== undefined) lastOpenTime = newTimer;
      updateUI();

      if (!supabaseClient) return;

      await supabaseClient
        .from('users')
        .upsert({
          telegram_id: telegramId,
          stars_balance: userBalance,
          free_case_timer: lastOpenTime
        });
    }

    function updateUI() {
      document.getElementById('balanceDisplay').innerText = userBalance;
      
      const now = Date.now();
      const timeLeft = (lastOpenTime + COOLDOWN_TIME) - now;
      const openBtn = document.getElementById('openFreeBtn');
      const timerDisplay = document.getElementById('timerDisplay');

      if (timeLeft > 0) {
        openBtn.disabled = true;
        const hours = Math.floor(timeLeft / (1000 * 60 * 60));
        const minutes = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
        timerDisplay.innerText = `Наступний кейс через: ${hours}г ${minutes}хв`;
      } else {
        openBtn.disabled = false;
        timerDisplay.innerText = `Кейс доступний безкоштовно!`;
      }
    }

    function getRandomItem(items) {
      const rand = Math.random() * 100;
      let cumulative = 0;
      for (let item of items) {
        cumulative += item.chance;
        if (rand <= cumulative) return item;
      }
      return items[0];
    }

    function startFreeOpening() {
      const now = Date.now();
      if (now < lastOpenTime + COOLDOWN_TIME) return;

      document.getElementById('openFreeBtn').disabled = true;
      const track = document.getElementById('rouletteTrackFree');
      const winningItem = getRandomItem(freeCaseItems);
      const winningIndex = 30;

      let html = '';
      for (let i = 0; i < 35; i++) {
        let item = (i === winningIndex) ? winningItem : getRandomItem(freeCaseItems);
        html += `<div class="roulette-item"><span>🎁</span>${item.name}</div>`;
      }
      track.innerHTML = html;

      track.style.transition = 'none';
      track.style.transform = 'translateX(0px)';

      setTimeout(() => {
        const itemWidth = 95;
        const offset = (winningIndex * itemWidth) - (160 - (itemWidth / 2));
        track.style.transition = 'transform 4s cubic-bezier(0.05, 0.9, 0.2, 1)';
        track.style.transform = `translateX(-${offset}px)`;
      }, 50);

      setTimeout(() => {
        const newBalance = userBalance + winningItem.value;
        saveUserData(newBalance, Date.now());
        tg.showAlert(`Вітаю! Ви виграли ${winningItem.name}`);
      }, 4100);
    }

    function startPaidOpening(cost) {
      if (userBalance < cost) {
        tg.showAlert("Недостатньо зірок на балансі!");
        return;
      }

      const winningItem = getRandomItem(paidCaseItems);
      const newBalance = userBalance - cost + winningItem.value;
      saveUserData(newBalance);
      tg.showAlert(`Ви відкрили преміум кейс і виграли ${winningItem.name}!`);
    }

    // Демо-поповнення (тут згодом можна підключити платіжну систему бота)
    function simulateInvoice(amount) {
      saveUserData(userBalance + amount);
      closeModal('topUpModal');
      tg.showAlert(`Баланс успішно поповнено на ${amount} ⭐!`);
    }

    function requestWithdraw() {
      if (userBalance < 500) {
        tg.showAlert("Для виведення потрібно мінімум 500 зірок!");
        return;
      }
      closeModal('withdrawModal');
      tg.showAlert("Заявку на виведення створено! Адміністратор перевірить її найближчим часом.");
    }

    function openTopUpModal() { document.getElementById('topUpModal').style.display = 'flex'; }
    function openWithdrawModal() { document.getElementById('withdrawModal').style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    function openPrizeModal(type) {
      const items = type === 'free' ? freeCaseItems : paidCaseItems;
      const container = document.getElementById('modalItemsList');
      container.innerHTML = items.map(i => `
        <div style="display:flex; justify-content:space-between; margin-bottom:8px; border-bottom:1px solid rgba(255,255,255,0.05); padding-bottom:6px;">
          <span>${i.name}</span>
          <span style="color:var(--accent);">${i.chance}%</span>
        </div>
      `).join('');
      document.getElementById('prizeModal').style.display = 'flex';
    }

    loadUserData();
  </script>
</body>
</html>
